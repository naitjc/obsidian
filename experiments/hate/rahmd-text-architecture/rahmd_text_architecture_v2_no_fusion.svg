<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #c9d1dc; stroke-width: 2; rx: 12; }
      .stage { fill: #eef5ff; stroke: #6b9bd2; stroke-width: 2; rx: 10; }
      .main { fill: #e9f8ef; stroke: #4d9d68; stroke-width: 2; rx: 10; }
      .retr { fill: #fff4e2; stroke: #d5962c; stroke-width: 2; rx: 10; }
      .out { fill: #f3edf9; stroke: #8a66b5; stroke-width: 2; rx: 10; }
      .note { fill: #ffffff; stroke: #d6dde7; stroke-width: 1.5; rx: 8; }
      .title { font: 700 34px Arial, "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .h2 { font: 700 22px Arial, "Microsoft YaHei", sans-serif; fill: #263241; }
      .txt { font: 18px Arial, "Microsoft YaHei", sans-serif; fill: #263241; }
      .small { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #44546a; }
      .tiny { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6778; }
      .arrow { stroke: #344054; stroke-width: 2.6; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #697586; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowheadGray); }
      .sep { stroke: #d7dee8; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#344054"/>
    </marker>
    <marker id="arrowheadGray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#697586"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="80" y="70">RA-HMD-style Text Hate Detection V2: LMH Main Output + Evidence Branch Output</text>
  <text class="small" x="82" y="105">No target-aware retrieval in this version. No fusion between the two classifier outputs.</text>

  <rect class="panel" x="60" y="135" width="1480" height="770"/>

  <rect class="stage" x="110" y="220" width="210" height="94"/>
  <text class="h2" x="145" y="257">Post Text</text>
  <text class="small" x="135" y="286">input social post</text>

  <rect class="stage" x="390" y="200" width="270" height="134"/>
  <text class="h2" x="432" y="242">Qwen3-4B LLM</text>
  <text class="small" x="424" y="274">fine-tuned encoder</text>
  <text class="tiny" x="424" y="300">produces hidden state h</text>

  <line class="arrow" x1="320" y1="267" x2="386" y2="267"/>

  <line class="sep" x1="720" y1="170" x2="720" y2="870"/>
  <text class="h2" x="775" y="177">Main classification branch</text>
  <text class="h2" x="775" y="507">Retrieval evidence branch</text>

  <rect class="main" x="790" y="220" width="235" height="94"/>
  <text class="h2" x="870" y="257">LMH</text>
  <text class="small" x="824" y="286">binary classification head</text>

  <rect class="out" x="1130" y="220" width="260" height="94"/>
  <text class="h2" x="1195" y="257">Output A</text>
  <text class="small" x="1172" y="286">p_LMH(hate / non-hate)</text>

  <line class="arrow" x1="660" y1="267" x2="786" y2="267"/>
  <line class="arrow" x1="1025" y1="267" x2="1126" y2="267"/>

  <rect class="retr" x="790" y="545" width="245" height="104"/>
  <text class="h2" x="837" y="582">Projection MLP</text>
  <text class="small" x="824" y="612">r = L2-normalize(MLP(h))</text>

  <rect class="retr" x="1105" y="535" width="300" height="124"/>
  <text class="h2" x="1150" y="572">Train-only Database</text>
  <text class="small" x="1144" y="604">stores r_train + label</text>
  <text class="tiny" x="1144" y="630">no valid/test samples in index</text>

  <rect class="retr" x="980" y="710" width="300" height="112"/>
  <text class="h2" x="1032" y="748">Label-separated Retrieval</text>
  <text class="small" x="1018" y="779">hate top-k evidence: r_pos</text>
  <text class="small" x="1018" y="805">non-hate top-k evidence: r_neg</text>

  <rect class="retr" x="650" y="710" width="260" height="112"/>
  <text class="h2" x="704" y="748">Evidence Features</text>
  <text class="small" x="682" y="779">[h, r, r_pos, r_neg]</text>
  <text class="small" x="682" y="805">diff, product, retrieval stats</text>

  <rect class="main" x="360" y="710" width="220" height="112"/>
  <text class="h2" x="410" y="748">Evidence MLP</text>
  <text class="small" x="393" y="779">case-comparison classifier</text>
  <text class="tiny" x="393" y="805">judges evidence-side label</text>

  <rect class="out" x="110" y="720" width="210" height="92"/>
  <text class="h2" x="175" y="756">Output B</text>
  <text class="small" x="134" y="784">p_EVI(hate / non-hate)</text>

  <line class="dash" x1="660" y1="302" x2="786" y2="597"/>
  <text class="tiny" x="790" y="472">h also feeds retrieval branch</text>

  <line class="arrow" x1="1035" y1="597" x2="1101" y2="597"/>
  <line class="arrow" x1="1255" y1="659" x2="1170" y2="706"/>
  <line class="arrow" x1="980" y1="766" x2="914" y2="766"/>
  <line class="arrow" x1="650" y1="766" x2="584" y2="766"/>
  <line class="arrow" x1="360" y1="766" x2="324" y2="766"/>

  <rect class="note" x="90" y="405" width="520" height="172"/>
  <text class="h2" x="120" y="445">Training / Inference Meaning</text>
  <text class="small" x="120" y="480">LMH: main LLM classifier output, directly trained for binary hate detection.</text>
  <text class="small" x="120" y="510">Evidence MLP: auxiliary evidence-side output, trained after retrieval features are built.</text>
  <text class="small" x="120" y="540">The two outputs are reported separately; no weighted average or fusion node.</text>

  <rect class="note" x="760" y="355" width="680" height="94"/>
  <text class="h2" x="790" y="390">What changed from the previous V1 picture?</text>
  <text class="small" x="790" y="422">1. LMH is restored as the native main classifier head.  2. Target retrieval is removed for now.  3. Fusion is removed.</text>

  <rect class="note" x="1010" y="845" width="430" height="36"/>
  <text class="tiny" x="1032" y="868">Database/retrieval uses training split only; valid/test are query-only.</text>
</svg>
